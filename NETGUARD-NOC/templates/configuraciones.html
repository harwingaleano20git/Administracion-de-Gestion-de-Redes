{% extends "base.html" %}{% block content %}<h2>Configuraciones Syslog multivendor</h2><p>Plantillas propuestas, nunca ejecutadas. Validación textual contra documentación; compatibilidad en equipos no verificada.</p><section class="panel spaced"><form class="filters" action="/configuraciones"><label>Fabricante<select name="brand">{% for b in ['Cisco','Fortinet','Huawei'] %}<option {{ 'selected' if brand==b else '' }}>{{ b }}</option>{% endfor %}</select></label><label>IPv4 del colector<input name="host" value="{{ host }}" required></label><label>Severidad máxima<input name="severity" type="number" min="0" max="7" value="{{ severity }}" required></label><label>Puerto UDP<input name="port" type="number" min="1" max="65535" value="{{ port }}" required></label><button class="secondary-button">Generar plantilla</button></form><pre>{{ config }}</pre><form action="/configuraciones/proponer" method="post" class="filters"><input type="hidden" name="brand" value="{{ brand }}"><input type="hidden" name="host" value="{{ host }}"><input type="hidden" name="severity" value="{{ severity }}"><input type="hidden" name="port" value="{{ port }}"><label>Revisor declarado<input name="actor" value="Harwin Galeano Beltran" required></label><label><input type="checkbox" name="approved" value="si"> Declaro revisión de esta propuesta. No autoriza ejecución real.</label><button class="secondary-button">Registrar propuesta</button></form><a href="{{ sources[brand] }}">Consultar fuente oficial {{ brand }}</a></section>{% endblock %}
